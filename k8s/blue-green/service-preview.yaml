# The PREVIEW service. Always points at green so you (and the pipeline's
# smoke test) can hit the new version BEFORE any user does.
# This is the part most tutorials skip, and it is what makes blue-green
# safer than a rolling update.
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo-preview
  namespace: cicd-demo
spec:
  type: NodePort
  selector:
    app: cicd-demo
    color: green
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30081
