# =============================================================================
# BONUS: BLUE-GREEN DEPLOYMENT - manual release of an ALREADY-BUILT image.
# Rolling update  = replace pods gradually, old and new serve users together.
# Blue-green      = run both versions fully, then switch 100% of traffic at once.
# Roll back = flip the label back. Seconds, not a rebuild.
#
# Use this when you want the switch on camera WITHOUT waiting for a build:
# ci-cd.yml already pushed the image, this just releases it.
# Runs on the self-hosted runner because a GitHub-hosted runner cannot reach
# a kind cluster on your laptop - no KUBE_CONFIG secret can fix that.
# =============================================================================
name: Blue-Green Deployment

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to release. Blank = <user>/cicd-demo:latest"
        required: false
        default: ""

jobs:
  release:
    name: Deploy to idle colour, smoke test, then switch
    runs-on: [self-hosted, macOS, kind]
    steps:
      - uses: actions/checkout@v4

      - name: Point kubectl at the local kind cluster
        run: |
          kind get clusters | grep -qx "cicd-demo" \
            || kind create cluster --name cicd-demo --config k8s/kind-cluster.yaml
          kubectl config use-context kind-cicd-demo

      # Blank input = release whatever :latest currently points at.
      - name: Work out which image to release
        run: |
          IMAGE="${{ inputs.image }}"
          if [ -z "$IMAGE" ]; then
            IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/cicd-demo:latest"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Releasing $IMAGE"

      # The blue-green Services must own nodePort 30080/30081. The rolling-update
      # demo takes 30080, so hand it back before cicd-demo-live asks for it.
      - name: Make sure the blue-green Services exist
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n cicd-demo delete svc    cicd-demo --ignore-not-found
          kubectl -n cicd-demo delete deploy cicd-demo --ignore-not-found
          kubectl -n cicd-demo get svc cicd-demo-live    >/dev/null 2>&1 || kubectl apply -f k8s/blue-green/service.yaml
          kubectl -n cicd-demo get svc cicd-demo-preview >/dev/null 2>&1 || kubectl apply -f k8s/blue-green/service-preview.yaml

      # STEP 1 - which colour is live right now? Ask the Service, not a file.
      - name: Find the live colour and pick the idle one
        run: |
          LIVE=$(kubectl -n cicd-demo get svc cicd-demo-live \
                   -o jsonpath='{.spec.selector.color}' 2>/dev/null || true)
          if [ "$LIVE" = "blue" ]; then IDLE=green; else IDLE=blue; fi
          echo "LIVE_COLOR=$LIVE" >> "$GITHUB_ENV"
          echo "IDLE_COLOR=$IDLE" >> "$GITHUB_ENV"
          echo "Live is ${LIVE:-nothing yet}, so the new version goes to $IDLE."

      # STEP 2 - deploy the new image to the IDLE colour. Zero users affected.
      - name: Deploy new image to the idle colour
        run: |
          if kubectl -n cicd-demo get deploy "cicd-demo-${IDLE_COLOR}" >/dev/null 2>&1; then
            kubectl -n cicd-demo set image "deploy/cicd-demo-${IDLE_COLOR}" "api=${IMAGE}"
          else
            sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" \
              "k8s/blue-green/deployment-${IDLE_COLOR}.yaml" | kubectl apply -f -
          fi
          kubectl -n cicd-demo rollout status "deploy/cicd-demo-${IDLE_COLOR}" --timeout=180s

      # STEP 3 - smoke test the idle colour through the preview Service (:30081),
      # while real users are still being served by the other colour.
      - name: Smoke test the idle colour
        run: |
          kubectl -n cicd-demo patch svc cicd-demo-preview \
            -p "{\"spec\":{\"selector\":{\"app\":\"cicd-demo\",\"color\":\"${IDLE_COLOR}\"}}}"
          # Ready pods are not a routable Service: poll until kube-proxy agrees.
          for i in $(seq 1 30); do
            RESPONSE=$(curl -fsS -m 5 http://localhost:30081/api/info 2>/dev/null || true)
            if echo "${RESPONSE}" | grep -q "\"color\":\"${IDLE_COLOR}\""; then
              echo "preview -> ${RESPONSE}"
              echo "Smoke test passed - safe to switch."
              exit 0
            fi
            echo "waiting for preview to serve ${IDLE_COLOR}... got: ${RESPONSE:-no response}"
            sleep 2
          done
          echo "Preview never served ${IDLE_COLOR} - refusing to switch."
          exit 1

      # STEP 4 - THE SWITCH. One label, all traffic, instantly.
      - name: Switch live traffic to the new colour
        run: |
          kubectl -n cicd-demo patch svc cicd-demo-live \
            -p "{\"spec\":{\"selector\":{\"app\":\"cicd-demo\",\"color\":\"${IDLE_COLOR}\"}}}"
          echo "Live traffic now served by ${IDLE_COLOR}."

      - name: Confirm real users are on the new colour
        run: |
          for i in $(seq 1 30); do
            RESPONSE=$(curl -fsS -m 5 http://localhost:30080/api/info 2>/dev/null || true)
            if echo "${RESPONSE}" | grep -q "\"color\":\"${IDLE_COLOR}\""; then
              echo "Live at http://localhost:30080 -> ${RESPONSE}"
              exit 0
            fi
            echo "waiting for live traffic to reach ${IDLE_COLOR}... got: ${RESPONSE:-no response}"
            sleep 2
          done
          echo "Live never reached ${IDLE_COLOR} - last response: ${RESPONSE}"
          exit 1

      # STEP 5 - the old colour stays running. That is the rollback button.
      - name: Note the rollback command
        run: |
          echo "Rollback: kubectl -n cicd-demo patch svc cicd-demo-live -p '{\"spec\":{\"selector\":{\"app\":\"cicd-demo\",\"color\":\"${LIVE_COLOR}\"}}}'"
          echo "Or simply: ./scripts/switch-color.sh ${LIVE_COLOR}"
