# =============================================================================
# THE PIPELINE:  GitHub  ->  Testing  ->  Docker Build  ->  Docker Hub  ->  K8s
# Each arrow in the assignment diagram is one job below, in the same order.
# =============================================================================
name: CI/CD Pipeline

# TRIGGER: what makes the pipeline run at all.
on:
  push:
    branches: [main]        # merge to main = release
  pull_request:
    branches: [main]        # PRs get tested, but never deployed
  workflow_dispatch:        # manual "Run workflow" button, useful on video
    inputs:
      strategy:
        description: "How job 3 should release the new version"
        type: choice
        default: blue-green
        options:
          - blue-green
          - rolling

# Values shared by every job. Change the image name in ONE place.
env:
  IMAGE_NAME: cicd-demo
  REGISTRY: docker.io

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 - TESTING.  Runs on every push AND every pull request.
  # Nothing downstream starts until this is green.
  # ---------------------------------------------------------------------------
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # caches ~/.cache/pip between runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  # ---------------------------------------------------------------------------
  # JOB 2 - DOCKER BUILD + IMAGE PUSH.
  # `needs: test` is the guardrail: a failing test means this job never starts.
  # Skipped entirely on pull requests - PRs must not publish images.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build image and push to Docker Hub
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag from the commit SHA
        id: meta
        run: |
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "sha_short=${SHA_SHORT}"        >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}:${SHA_SHORT}"   >> "$GITHUB_OUTPUT"
          echo "Will build ${IMAGE}:${SHA_SHORT}"

      # QEMU lets the amd64 GitHub runner cross-build an arm64 layer too, so
      # the image also runs on Apple Silicon (the self-hosted deploy target).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx gives us layer caching that survives between workflow runs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # access token, NOT your password

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.sha_short }}
          # TWO tags on purpose:
          #   :<sha>  immutable, this exact commit - what we deploy
          #   :latest a moving pointer - convenient for humans, never for k8s
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # JOB 3 - KUBERNETES DEPLOYMENT, BLUE-GREEN (the default).
  # Deploys the new image to whichever colour is NOT live, proves it works on
  # the preview port, and only then moves real users. Deploying and releasing
  # are two separate events - that separation IS blue-green.
  # Runs on a self-hosted runner (your Mac) so it can reach the local `kind`
  # cluster directly - no cloud cluster, no KUBE_CONFIG secret needed.
  # ---------------------------------------------------------------------------
  deploy-bluegreen:
    name: Deploy to Kubernetes (blue-green)
    needs: build-and-push
    if: ${{ github.event_name != 'pull_request' && (inputs.strategy || 'blue-green') == 'blue-green' }}
    runs-on: [self-hosted, macOS, kind]
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the local kind cluster exists
        run: |
          if kind get clusters | grep -qx "cicd-demo"; then
            echo "kind cluster 'cicd-demo' already exists - reusing it."
          else
            echo "No 'cicd-demo' kind cluster found - creating one."
            kind create cluster --name cicd-demo --config k8s/kind-cluster.yaml
          fi

      - name: Point kubectl at the local kind cluster
        run: kubectl config use-context kind-cicd-demo

      # Only one Service can own nodePort 30080. If the rolling-update demo is
      # currently holding it, take it back, or cicd-demo-live cannot be created.
      - name: Release nodePort 30080 from the rolling-update deploy
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n cicd-demo delete svc    cicd-demo --ignore-not-found
          kubectl -n cicd-demo delete deploy cicd-demo --ignore-not-found

      # The idle colour is the one nobody is being served by, so it is the only
      # one we are allowed to overwrite. First ever run has no live Service.
      - name: Work out which colour is live
        run: |
          LIVE=$(kubectl -n cicd-demo get svc cicd-demo-live \
                   -o jsonpath='{.spec.selector.color}' 2>/dev/null || true)
          if [ "$LIVE" = "blue" ]; then IDLE=green; else IDLE=blue; fi
          echo "LIVE_COLOR=$LIVE" >> "$GITHUB_ENV"
          echo "IDLE_COLOR=$IDLE" >> "$GITHUB_ENV"
          echo "live=${LIVE:-none yet}  ->  deploying into $IDLE"

      - name: Deploy the new image into the idle colour
        run: |
          if kubectl -n cicd-demo get deploy "cicd-demo-${IDLE_COLOR}" >/dev/null 2>&1; then
            kubectl -n cicd-demo set image "deploy/cicd-demo-${IDLE_COLOR}" "api=${IMAGE}"
          else
            sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" \
              "k8s/blue-green/deployment-${IDLE_COLOR}.yaml" | kubectl apply -f -
          fi
          kubectl -n cicd-demo rollout status "deploy/cicd-demo-${IDLE_COLOR}" --timeout=180s

      # Preview always points at the colour we just deployed, so the new version
      # is reachable on :30081 while real users stay on the old one.
      - name: Expose the new version on the preview port
        run: |
          kubectl apply -f k8s/blue-green/service-preview.yaml
          kubectl -n cicd-demo patch svc cicd-demo-preview \
            -p "{\"spec\":{\"selector\":{\"app\":\"cicd-demo\",\"color\":\"${IDLE_COLOR}\"}}}"

          # Ready pods are NOT the same thing as a routable Service. kube-proxy
          # needs a moment to program the new endpoints; until it has, the kind
          # node accepts the TCP connection and then resets it. Wait it out.
          for i in $(seq 1 30); do
            EPS=$(kubectl -n cicd-demo get endpoints cicd-demo-preview \
                    -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
            if [ -n "$EPS" ]; then echo "preview endpoints ready: ${EPS}"; break; fi
            echo "waiting for preview endpoints..."
            sleep 2
          done

      # THE GATE. Fail here and the job stops with live traffic untouched - there
      # is nothing to roll back, because no release ever happened.
      - name: Smoke-test the new version before any user sees it
        run: |
          EXPECTED="${IMAGE##*:}"
          RESPONSE=$(curl -fsS --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors \
            http://localhost:30081/api/info)
          echo "preview -> ${RESPONSE}"
          echo "${RESPONSE}" | grep -q "\"version\":\"${EXPECTED}\"" \
            || { echo "Preview is not serving ${EXPECTED} - refusing to promote."; exit 1; }
          echo "${RESPONSE}" | grep -q "\"color\":\"${IDLE_COLOR}\"" \
            || { echo "Preview is not serving ${IDLE_COLOR} - refusing to promote."; exit 1; }
          echo "Smoke test passed - safe to promote."

      # THE RELEASE. One selector edit moves every user at once. No pod starts and
      # no image is pulled: the new version has been running and warm all along.
      - name: Promote - move live traffic to the new colour
        run: |
          if ! kubectl -n cicd-demo get svc cicd-demo-live >/dev/null 2>&1; then
            kubectl apply -f k8s/blue-green/service.yaml
          fi
          kubectl -n cicd-demo patch svc cicd-demo-live \
            -p "{\"spec\":{\"selector\":{\"app\":\"cicd-demo\",\"color\":\"${IDLE_COLOR}\"}}}"
          echo "live traffic: ${LIVE_COLOR:-none} -> ${IDLE_COLOR}"

      - name: Verify what real users are getting
        run: |
          EXPECTED="${IMAGE##*:}"
          RESPONSE=$(curl -fsS --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors \
            http://localhost:30080/api/info)
          echo "Live at http://localhost:30080 -> ${RESPONSE}"
          echo "${RESPONSE}" | grep -q "\"version\":\"${EXPECTED}\"" \
            || { echo "Live is not serving ${EXPECTED}"; exit 1; }
          echo "Status: ONLINE (${IDLE_COLOR}, ${EXPECTED})"

      # Instant rollback: the old colour never stopped running, so undoing the
      # release is one more selector edit - not a redeploy.
      - name: Roll back if the promotion failed
        if: failure()
        run: |
          if [ -n "${LIVE_COLOR}" ]; then
            echo "Promotion failed - putting live traffic back on ${LIVE_COLOR}."
            kubectl -n cicd-demo patch svc cicd-demo-live \
              -p "{\"spec\":{\"selector\":{\"app\":\"cicd-demo\",\"color\":\"${LIVE_COLOR}\"}}}"
          else
            echo "First deploy - no previous colour to roll back to."
          fi

  # ---------------------------------------------------------------------------
  # JOB 3 (alternative) - KUBERNETES DEPLOYMENT, ROLLING UPDATE.
  # The original strategy, kept so both can be demonstrated. Only runs when you
  # pick "rolling" from the Run workflow menu, because it and blue-green both
  # want nodePort 30080 and cannot be live at the same time.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes (rolling update)
    needs: build-and-push
    if: ${{ github.event_name != 'pull_request' && inputs.strategy == 'rolling' }}
    runs-on: [self-hosted, macOS, kind]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the local kind cluster exists
        run: |
          if kind get clusters | grep -qx "cicd-demo"; then
            echo "kind cluster 'cicd-demo' already exists - reusing it."
          else
            echo "No 'cicd-demo' kind cluster found - creating one."
            kind create cluster --name cicd-demo --config k8s/kind-cluster.yaml
          fi

      - name: Point kubectl at the local kind cluster
        run: kubectl config use-context kind-cicd-demo

      # Mirror image of the blue-green job: take nodePort 30080 back from the
      # blue-green Services so the plain cicd-demo Service can bind it.
      - name: Release nodePort 30080 from the blue-green deploy
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n cicd-demo delete svc    cicd-demo-live cicd-demo-preview --ignore-not-found
          kubectl -n cicd-demo delete deploy cicd-demo-blue cicd-demo-green   --ignore-not-found

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service.yaml
          # First deploy only: create the Deployment with a real image.
          if ! kubectl -n cicd-demo get deploy cicd-demo >/dev/null 2>&1; then
            sed "s|IMAGE_PLACEHOLDER|${{ needs.build-and-push.outputs.image }}|" \
              k8s/deployment.yaml | kubectl apply -f -
          fi

      # This one line is "continuous deployment". Everything above exists
      # so that this line is safe to run automatically.
      - name: Roll out the new image
        run: |
          kubectl -n cicd-demo set image deploy/cicd-demo \
            api=${{ needs.build-and-push.outputs.image }}
          kubectl -n cicd-demo rollout status deploy/cicd-demo --timeout=120s

      # rollout status only proves the pods are Ready - this proves the
      # Service actually answers, and prints which colour/version is live.
      - name: Verify the app is online
        run: |
          RESPONSE=$(curl -fsS --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors \
            http://localhost:30080/api/info)
          echo "Live at http://localhost:30080 -> ${RESPONSE}"
          echo "${RESPONSE}" | grep -q '"color":"blue"' \
            && echo "Status: ONLINE (blue)" \
            || { echo "Status: unexpected response - not confirmed blue"; exit 1; }

      # If readiness never goes green, undo automatically. Show this failing
      # on video by pushing a deliberately broken commit.
      - name: Roll back if the rollout failed
        if: failure()
        run: kubectl -n cicd-demo rollout undo deploy/cicd-demo
